# Builds the disk image on every push to main and publishes it as a GitHub release.
# Tags are v<CFBundleShortVersionString>.<run number>; notes list the commits since the previous release tag.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build disk image
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          ORBIT_RELEASE_VERSION="$VERSION.$GITHUB_RUN_NUMBER" ./scripts/build-dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          TAG="v$VERSION.$GITHUB_RUN_NUMBER"
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "## Changes"
            git log --no-merges --format='- %s (%h)' ${PREV:+$PREV..}HEAD
          } > notes.md
          gh release create "$TAG" "build/Orbit-$VERSION.dmg" \
            --target "$GITHUB_SHA" --title "Orbit $TAG" --notes-file notes.md --latest
